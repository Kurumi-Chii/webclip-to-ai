name: Publish preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check.mjs --tag "$RELEASE_TAG"
      - run: npm test
      - run: npm run build
      - name: Create prerelease with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "WebClip to AI $RELEASE_TAG" --notes-file docs/RELEASE_NOTES_1.2.1.md
